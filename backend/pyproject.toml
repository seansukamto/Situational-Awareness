[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "situational-awareness-api"
version = "0.1.0"
description = "Authoritative retail sustainability simulation API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "pydantic>=2.10,<3",
  "pypdf>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
